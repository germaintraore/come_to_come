<!-- ===== COMPOSANT FIL D'ARIANE (BREADCRUMB) ===== -->
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb ctc-breadcrumb py-2 px-3 rounded-3 bg-secondary bg-opacity-10 border border-secondary border-opacity-25 small mb-0">
        <li class="breadcrumb-item">
            <a href="{% url 'accueil' %}" class="text-white-50 text-decoration-none">
                <i class="bi bi-house-door me-1"></i>Accueil
            </a>
        </li>
        {% if parent_url and parent_title %}
        <li class="breadcrumb-item">
            <a href="{{ parent_url }}" class="text-white-50 text-decoration-none">
                {{ parent_title }}
            </a>
        </li>
        {% endif %}
        <li class="breadcrumb-item active text-warning fw-semibold" aria-current="page">
            {{ current_title }}
        </li>
    </ol>
</nav>
